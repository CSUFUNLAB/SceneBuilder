schema_version: 1
question_type: evolution

unknown_answer:
  label: unknown
  description: Use only when the event and target are valid but the before/after Twin evidence cannot determine one unique supported answer.
  evidence_required: true

# Event types are independent of question templates. The evolution scene and
# Twin generation stages use this catalog directly.
events:
  - id: node_failure
    entity_type: node
    description: Disable one normal node. Its attached interfaces and channels become operationally unavailable, while the precomputed static routes remain unchanged.
  - id: node_recovery
    entity_type: node
    description: Restore one disabled node to normal without changing the topology, traffic configuration, or precomputed static routes.
  - id: channel_failure
    entity_type: channel
    description: Disable one normal channel while leaving its endpoint nodes unchanged. Static routes are not recomputed after the failure.
  - id: channel_recovery
    entity_type: channel
    description: Restore one disabled or degraded channel to its normal state and original capacity without changing its endpoint nodes or static routes.
  - id: nic_failure
    entity_type: nic
    description: Disable one normal network interface. The channel attached to that interface becomes operationally unavailable, while both endpoint nodes remain unchanged.
  - id: nic_recovery
    entity_type: nic
    description: Restore one disabled network interface to normal, allowing its attached channel to operate again when no other endpoint fault exists.
  - id: flow_load_change
    entity_type: data_flow
    description: Change one data flow's demand to its current value multiplied by a random factor from the configured range while keeping its endpoints, static path, and traffic model unchanged.
  - id: flow_addition
    entity_type: data_flow
    description: Add one CBR data flow with a new flow ID, a randomly selected routable source-destination node pair that has no existing flow, and a demand sampled from the configured range.

