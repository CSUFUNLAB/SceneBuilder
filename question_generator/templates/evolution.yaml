schema_version: 1
question_type: evolution

events:
  - id: node_failure
    entity_type: node
    description: "Node failure disables all interfaces on that node."
  - id: interface_failure
    entity_type: interface
    description: "One interface fails in both directions."
  - id: channel_failure
    entity_type: channel
    description: "One channel stops delivering traffic in both directions."
  - id: flow_load_change
    entity_type: data_flow
    description: "Set the offered demand of one existing data flow to a new Mbps value."

# Four events x four targets: throughput change, interface state change, channel state change, flow state change.
templates:

  - id: TE0001
    question: "If node $node_id$ fails, how will the throughput of data flow $data_flow_id$ change: increase, decrease, or remain unchanged within +/-3%?"
    answer: [increase, unchanged, decrease]

  - id: TE0002
    question: "If node $node_id$ fails, how will the operating state of interface $interface_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0003
    question: "If node $node_id$ fails, how will the operating state of channel $channel_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0004
    question: "If node $node_id$ fails, how will the operating state of data flow $data_flow_id$ change?"
    answer: [normal_to_congested, normal_to_lossy, normal_to_failed, congested_to_normal, congested_to_lossy, congested_to_failed, lossy_to_normal, lossy_to_congested, lossy_to_failed, failed_to_normal, failed_to_congested, failed_to_lossy, unchanged]

  - id: TE0005
    question: "If interface $interface_id$ fails, how will the throughput of data flow $data_flow_id$ change: increase, decrease, or remain unchanged within +/-3%?"
    answer: [increase, unchanged, decrease]

  - id: TE0006
    question: "If interface $changed_interface_id$ fails, how will the operating state of interface $interface_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0007
    question: "If interface $interface_id$ fails, how will the operating state of channel $channel_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0008
    question: "If interface $interface_id$ fails, how will the operating state of data flow $data_flow_id$ change?"
    answer: [normal_to_congested, normal_to_lossy, normal_to_failed, congested_to_normal, congested_to_lossy, congested_to_failed, lossy_to_normal, lossy_to_congested, lossy_to_failed, failed_to_normal, failed_to_congested, failed_to_lossy, unchanged]

  - id: TE0009
    question: "If channel $channel_id$ fails, how will the throughput of data flow $data_flow_id$ change: increase, decrease, or remain unchanged within +/-3%?"
    answer: [increase, unchanged, decrease]

  - id: TE0010
    question: "If channel $channel_id$ fails, how will the operating state of interface $interface_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0011
    question: "If channel $changed_channel_id$ fails, how will the operating state of channel $channel_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0012
    question: "If channel $channel_id$ fails, how will the operating state of data flow $data_flow_id$ change?"
    answer: [normal_to_congested, normal_to_lossy, normal_to_failed, congested_to_normal, congested_to_lossy, congested_to_failed, lossy_to_normal, lossy_to_congested, lossy_to_failed, failed_to_normal, failed_to_congested, failed_to_lossy, unchanged]

  - id: TE0013
    question: "If the demand of data flow $changed_data_flow_id$ becomes $demand_mbps$ Mbps, how will the throughput of data flow $data_flow_id$ change: increase, decrease, or remain unchanged within +/-3%?"
    answer: [increase, unchanged, decrease]

  - id: TE0014
    question: "If the demand of data flow $data_flow_id$ becomes $demand_mbps$ Mbps, how will the operating state of interface $interface_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0015
    question: "If the demand of data flow $data_flow_id$ becomes $demand_mbps$ Mbps, how will the operating state of channel $channel_id$ change: from normal to saturated, from saturated to normal, or remain unchanged?"
    answer: [normal_to_saturated, saturated_to_normal, unchanged]

  - id: TE0016
    question: "If the demand of data flow $changed_data_flow_id$ becomes $demand_mbps$ Mbps, how will the operating state of data flow $data_flow_id$ change?"
    answer: [normal_to_congested, normal_to_lossy, normal_to_failed, congested_to_normal, congested_to_lossy, congested_to_failed, lossy_to_normal, lossy_to_congested, lossy_to_failed, failed_to_normal, failed_to_congested, failed_to_lossy, unchanged]
