network_mode: hybrid
scene_format: unified_jsonl
output_root: ../generated/wifi_v2_normal_example
seed: 2026092102
scenes_per_topology: 1
max_topology_nodes: 20
scene_duration: 8

topology_sources:
  - name: custom_20node_wifi_v2
    type: topologyzoo
    enabled: true
    root_dir: ../examples/topologies
    glob_patterns: ["custom_20node.gml"]

nodes:
  assignment_mode: topology_role
  trust_input_node_roles: true
  trusted_node_role_fields: [role]

link_generation:
  mode: role_based_random
  preserve_input_bandwidth: true
  treat_as_undirected: true
  role_based_random:
    trust_input_link_roles: true
    trusted_link_role_fields: [role]
    role_bandwidth_mbps:
      backbone:
        bandwidth_candidates_mbps: [40000]
      uplink:
        bandwidth_candidates_mbps: [10000]
      lateral:
        bandwidth_candidates_mbps: [5000]

nics:
  wired_device_type: point_to_point
  queue_policy_mode: single
  single_queue_policy: FIFO
  queue_size_range_packets: [256, 512]
  ip_cidr: 172.20.0.0/16
  ip_cidr_candidates: [172.20.0.0/16]
  ip_cidr_probabilities:
    172.20.0.0/16: 1.0
  link_subnet_prefix: 30
  link_subnet_prefix_probabilities:
    30: 1.0

wifi:
  standard_probabilities:
    802.11g: 0.6
    802.11n: 0.4
  channel_numbers: [1, 6, 11]
  channel_width_mhz: 20
  tx_power_candidates_dbm: [16, 18, 20]
  loss_exponent_candidates: [2.0, 2.2, 2.4]
  rate_manager: IdealWifiManager
  ip_cidr: 198.18.0.0/15
  subnet_prefix: 24
  area_width_m: 200
  area_height_m: 150
  min_ap_distance_m: 40
  sta_distance_range_m: [5, 15]
  ap_height_m: 2.5
  sta_height_m: 1.0
  moving_sta_ratio: 0.3
  sta_speed_range_mps: [0.5, 1.0]

routing:
  weight_range: [1.0, 8.0]

traffic_matrix:
  mode: uniform
  mode_probabilities:
    uniform: 1.0
  flow_count_range: [0.4, 0.5]
  max_flow_count: 10
  uniform_range_mbps: [0.5, 2.0]

flow_feature:
  selection_mode: single
  selection_mode_probabilities:
    single: 1.0
  single_model: cbr
  single_model_probabilities:
    cbr: 1.0
  mode_probabilities:
    cbr: 1.0

fault_generation:
  scenario_probabilities:
    normal: 1.0
    single: 0.0
    double: 0.0
  channel_state_probabilities:
    disabled: 0.5
    degraded: 0.5
  channel_degradation_multipliers: [0.5]
  nic_state_probabilities:
    disabled: 1.0

events:
  enabled: false
  count: 0
